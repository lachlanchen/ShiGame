name: Validate SHI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install audio measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: shi-web-dist
          path: apps/web/dist
          if-no-files-found: error
