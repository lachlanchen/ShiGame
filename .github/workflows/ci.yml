name: Validate SHI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-crossing-rules:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check native crossing against canonical replay fixtures
        run: bash scripts/test-native-crossing.sh
      - name: Check native crossing campaign and legacy chapter behavior
        run: bash scripts/test-native-crossing-campaign.sh
      - name: Typecheck native app production and preview configurations
        run: bash scripts/typecheck-native-ios.sh

  web-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install audio measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - name: Validate isolated internal crossing candidate without publishing it
        run: npm run build:internal-crossing
      - uses: actions/upload-artifact@v7
        with:
          name: shi-web-dist
          path: apps/web/dist
          if-no-files-found: error
