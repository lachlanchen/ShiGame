name: Deploy playable web chapter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Package mirrors can consume most of 15 minutes before validation begins.
    # Keep the full build/quality gates and allow time to upload and deploy.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install audio measurement toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
        env:
          SHI_BASE_PATH: /ShiGame/
      - uses: actions/configure-pages@v6
      - name: Include mobile privacy and support pages
        run: cp store/privacy.html store/support.html apps/web/dist/
      - name: Include standalone first-volume story reading
        run: |
          mkdir -p apps/web/dist/story
          cp store/story.html apps/web/dist/story/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
