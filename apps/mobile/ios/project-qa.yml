# Separate simulator-only app identity. Never archive or submit this project.
include: project.yml
name: SHIAftermathQA
targets:
  SHI:
    sources:
      - path: ../../../content/campaigns/chen-retreat.rules.v1.json
        buildPhase: resources
      - path: ../../../content/story-drafts/chen-retreat.v1.json
        buildPhase: resources
      - path: ../../../content/campaigns/refuge.rules.v1.json
        buildPhase: resources
      - path: ../../../content/story-drafts/refuge.v1.json
        buildPhase: resources
      - path: ../../../content/story-drafts/refuge-morning.v1.json
        buildPhase: resources
      - path: ../../../content/story-drafts/refuge-contact.v1.json
        buildPhase: resources
      - path: ../../../content/story-drafts/refuge-followup.v1.json
        buildPhase: resources
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHI_RETREAT_PREVIEW"
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.shi.aftermathqa
        INFOPLIST_KEY_CFBundleDisplayName: SHI QA
        CODE_SIGNING_ALLOWED: NO
  SHITests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.shi.aftermathqa.tests
        CODE_SIGNING_ALLOWED: NO
  SHIUITests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHI_RETREAT_PREVIEW"
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.shi.aftermathqa.uitests
        CODE_SIGNING_ALLOWED: NO
